name: Cards do perfil

on:
  schedule:
    - cron: "17 6 * * *" # todo dia às 03:17 (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cards.yml]

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gerar cards de estatísticas
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: America/Sao_Paulo
          THEME: github_dark
          ANIMATION: sequence
          EXCLUDE: HTML,CSS,Dockerfile,Shell
